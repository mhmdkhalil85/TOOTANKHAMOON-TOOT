<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080706">

<meta name="description" content="TOOT ANKH AMOON — $TOOT, an Egyptian-inspired community memecoin on Solana.">

<meta property="og:title" content="TOOT ANKH AMOON — $TOOT">
<meta property="og:description" content="The memecoin era meets ancient Egypt.">
<meta property="og:type" content="website">

<title>TOOT ANKH AMOON — $TOOT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#080706;
  --bg2:#0d0a07;
  --card:#15100b;
  --gold:#d6a84f;
  --gold2:#f0cf75;
  --gold3:#9e7027;
  --text:#f5efe5;
  --muted:#aaa092;
  --border:rgba(214,168,79,.22);
  --green:#69d391;
  --max:1180px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(214,168,79,.15),transparent 40%),
    radial-gradient(circle at 100% 35%,rgba(126,82,25,.09),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:"Inter",sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.025;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:70px 70px;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

.container{
  width:min(calc(100% - 36px),var(--max));
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  backdrop-filter:blur(18px);
  background:rgba(8,7,6,.78);
  border-bottom:1px solid rgba(214,168,79,.12);
}

.nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-family:"Cinzel",serif;
  font-weight:900;
  letter-spacing:.08em;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid var(--gold);
  color:var(--gold2);
  background:radial-gradient(circle,rgba(214,168,79,.18),rgba(0,0,0,.4));
  box-shadow:0 0 30px rgba(214,168,79,.12);
  font-size:20px;
}

.brand span{
  font-size:14px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.nav-links a{
  transition:.2s;
}

.nav-links a:hover{
  color:var(--gold2);
}

.nav-cta{
  padding:10px 16px;
  border-radius:999px;
  color:#110d07!important;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
}

/* =========================
   HERO
========================= */

.hero{
  min-height:100vh;
  padding:145px 0 90px;
  display:flex;
  align-items:center;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:65px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 13px;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(214,168,79,.06);
  color:var(--gold2);
  font-size:11px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.eyebrow-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
}

h1{
  margin-top:25px;
  font-family:"Cinzel",serif;
  font-size:clamp(48px,7vw,86px);
  line-height:.98;
  font-weight:900;
  letter-spacing:-.03em;
}

.gold{
  color:var(--gold2);
  text-shadow:0 0 35px rgba(214,168,79,.16);
}

.hero-subtitle{
  margin-top:25px;
  max-width:650px;
  font-size:clamp(18px,2vw,23px);
  color:#ddd3c3;
  font-weight:600;
}

.hero-description{
  margin-top:14px;
  max-width:600px;
  color:var(--muted);
  font-size:15px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:49px;
  padding:0 19px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:13px;
  font-weight:900;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  color:#110d07;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 15px 35px rgba(214,168,79,.14);
}

.btn-secondary{
  background:rgba(255,255,255,.025);
}

.btn-secondary:hover{
  background:rgba(214,168,79,.07);
}

/* =========================
   CONTRACT
========================= */

.contract-box{
  margin-top:22px;
  max-width:700px;
  padding:18px;
  border-radius:16px;
  border:1px solid var(--border);
  background:
    linear-gradient(145deg,rgba(214,168,79,.075),rgba(255,255,255,.015));
}

.contract-label{
  display:block;
  margin-bottom:9px;
  color:var(--gold2);
  font-size:10px;
  font-weight:900;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.contract-row{
  display:flex;
  align-items:center;
  gap:9px;
}

.contract-address{
  flex:1;
  min-width:0;
  padding:12px;
  border-radius:10px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.06);
  color:#d0c6b6;
  font-family:monospace;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.copy-btn{
  min-height:43px;
  padding:0 15px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  color:#110d07;
  background:var(--gold2);
  font-size:12px;
  font-weight:900;
}

.copy-btn:active{
  transform:scale(.97);
}

.copy-status{
  display:block;
  min-height:17px;
  margin-top:7px;
  color:var(--green);
  font-size:11px;
}

.hero-quick-links{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  color:#756e64;
  font-size:11px;
}

.hero-quick-links a{
  color:#bda875;
  font-weight:800;
}

.hero-quick-links a:hover{
  color:var(--gold2);
}

/* =========================
   HERO ART
========================= */

.hero-art{
  min-height:500px;
  position:relative;
  display:grid;
  place-items:center;
}

.sun{
  width:390px;
  height:390px;
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle,rgba(240,207,117,.17),rgba(214,168,79,.06) 43%,transparent 70%);
}

.scarab{
  position:relative;
  width:min(340px,70vw);
  aspect-ratio:1;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid rgba(214,168,79,.5);
  background:radial-gradient(circle at 50% 35%,rgba(240,207,117,.18),rgba(20,15,9,.96) 62%);
  box-shadow:
    0 0 70px rgba(214,168,79,.12),
    inset 0 0 70px rgba(214,168,79,.08);
}

.scarab:before{
  content:"𓂀";
  font-size:clamp(100px,16vw,170px);
  color:var(--gold2);
  filter:drop-shadow(0 0 25px rgba(240,207,117,.23));
}

.scarab:after{
  content:"TOOT";
  position:absolute;
  bottom:54px;
  font-family:"Cinzel",serif;
  font-size:20px;
  font-weight:900;
  letter-spacing:.35em;
  color:var(--gold2);
  transform:translateX(.17em);
}

.orbital{
  position:absolute;
  width:410px;
  height:410px;
  border:1px solid rgba(214,168,79,.18);
  border-radius:50%;
  transform:rotate(-20deg) scaleY(.42);
}

/* =========================
   SECTIONS
========================= */

section{
  padding:105px 0;
}

.section-kicker{
  color:var(--gold);
  font-size:10px;
  font-weight:900;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.section-title{
  margin-top:9px;
  font-family:"Cinzel",serif;
  font-size:clamp(32px,5vw,54px);
  line-height:1.05;
}

.section-intro{
  margin-top:15px;
  max-width:670px;
  color:var(--muted);
}

/* =========================
   ABOUT
========================= */

.about-grid{
  margin-top:45px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:20px;
}

.card{
  padding:30px;
  border-radius:22px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  box-shadow:0 20px 60px rgba(0,0,0,.16);
}

.card h3{
  margin-bottom:12px;
  font-family:"Cinzel",serif;
  color:var(--gold2);
  font-size:24px;
}

.card p{
  color:var(--muted);
  font-size:15px;
}

.feature-list{
  display:grid;
  gap:15px;
}

.feature{
  display:flex;
  gap:13px;
  align-items:flex-start;
}

.feature-icon{
  flex:0 0 38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:rgba(214,168,79,.08);
  border:1px solid var(--border);
}

.feature strong{
  display:block;
  font-size:14px;
}

.feature span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   LINKS
========================= */

.link-grid{
  margin-top:42px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.link-card{
  padding:22px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(255,255,255,.02);
  transition:.2s;
}

.link-card:hover{
  transform:translateY(-4px);
  background:rgba(214,168,79,.06);
  border-color:rgba(214,168,79,.4);
}

.link-card .icon{
  font-size:24px;
  margin-bottom:11px;
}

.link-card strong{
  display:block;
}

.link-card span{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   TOKEN
========================= */

.token-grid{
  margin-top:43px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.token-item{
  padding:23px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.018);
}

.token-item small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.token-item strong{
  display:block;
  margin-top:7px;
  color:var(--gold2);
  font-family:"Cinzel",serif;
  font-size:21px;
}

/* =========================
   ROADMAP
========================= */

.roadmap{
  margin-top:47px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.phase{
  padding:28px;
  min-height:255px;
  border:1px solid var(--border);
  border-radius:22px;
  background:linear-gradient(160deg,rgba(214,168,79,.06),rgba(255,255,255,.015));
}

.phase-number{
  color:var(--gold);
  font-size:11px;
  font-weight:900;
  letter-spacing:.14em;
}

.phase h3{
  margin-top:9px;
  font-family:"Cinzel",serif;
  color:var(--gold2);
  font-size:24px;
}

.phase ul{
  margin-top:16px;
  padding-left:18px;
  color:var(--muted);
  font-size:13px;
}

.phase li{
  margin-bottom:7px;
}

/* =========================
   CTA
========================= */

.cta{
  padding:65px 35px;
  border:1px solid var(--border);
  border-radius:28px;
  background:
    radial-gradient(circle at 50% 0%,rgba(214,168,79,.13),transparent 58%),
    rgba(255,255,255,.02);
  text-align:center;
}

.cta h2{
  margin-top:8px;
  font-family:"Cinzel",serif;
  font-size:clamp(30px,5vw,52px);
  line-height:1.1;
}

.cta p{
  max-width:650px;
  margin:15px auto 0;
  color:var(--muted);
}

.cta-buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:11px;
  margin-top:26px;
}

/* =========================
   FOOTER
========================= */

footer{
  padding:45px 0 30px;
  border-top:1px solid rgba(214,168,79,.1);
}

.footer-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.footer-text{
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}

.footer-links{
  display:flex;
  gap:18px;
  color:var(--muted);
  font-size:11px;
}

.footer-links a:hover{
  color:var(--gold2);
}

.disclaimer{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.05);
  color:#71695f;
  font-size:9px;
  line-height:1.7;
  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .nav-links a:not(.nav-cta){
    display:none;
  }

  .hero-grid,
  .about-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:125px;
  }

  .hero-art{
    min-height:390px;
    order:-1;
  }

  .scarab{
    width:275px;
  }

  .orbital{
    width:335px;
    height:335px;
  }

  .link-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .roadmap{
    grid-template-columns:1fr;
  }

}

@media(max-width:560px){

  .container{
    width:min(calc(100% - 24px),var(--max));
  }

  .nav{
    height:68px;
  }

  .brand span{
    font-size:11px;
  }

  .brand-mark{
    width:36px;
    height:36px;
  }

  h1{
    font-size:43px;
  }

  .hero-buttons{
    flex-direction:column;
  }

  .hero-buttons .btn{
    width:100%;
  }

  .contract-row{
    flex-direction:column;
  }

  .contract-address,
  .copy-btn{
    width:100%;
  }

  .copy-btn{
    min-height:46px;
  }

  .hero-quick-links{
    justify-content:center;
    flex-wrap:wrap;
  }

  .link-grid{
    grid-template-columns:1fr;
  }

  .token-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:22px;
  }

  section{
    padding:75px 0;
  }

  .footer-main{
    flex-direction:column;
    text-align:center;
  }

  .footer-links{
    flex-wrap:wrap;
    justify-content:center;
  }

}

</style>
</head>
